<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products | Maia</title>
  <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
<div th:replace="~{fragments :: navigation}"></div>
<main>
  <h1>Products</h1>
  <p><a th:href="@{/products/create}">Create product</a></p>
  <p th:if="${#lists.isEmpty(products)}">No products yet.</p>
  <table th:unless="${#lists.isEmpty(products)}">
    <thead><tr><th>Name</th><th>Price</th><th>Actions</th></tr></thead>
    <tbody>
    <tr th:each="product : ${products}">
      <td th:text="${product.name}"></td>
      <td th:text="${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}"></td>
      <td class="actions">
        <a th:href="@{/products/{id}/edit(id=${product.id})}">Edit</a>
        <form th:action="@{/products/{id}/delete(id=${product.id})}" method="post">
          <button type="submit">Delete</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</main>
</body>
</html>
