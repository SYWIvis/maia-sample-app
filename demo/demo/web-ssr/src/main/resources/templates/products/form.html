<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${pageTitle} + ' | Maia'">Product | Maia</title>
  <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
<div th:replace="~{fragments :: navigation}"></div>
<main>
  <h1 th:text="${pageTitle}">Product</h1>
  <form th:action="${formAction}" th:object="${productForm}" method="post">
    <label for="name">Name</label>
    <input id="name" type="text" th:field="*{name}" required maxlength="128">
    <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
    <label for="price">Price</label>
    <input id="price" type="number" step="0.01" min="0" th:field="*{price}" required>
    <p class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
    <button type="submit" th:text="${productId == null ? 'Create' : 'Save'}">Save</button>
  </form>
  <p><a th:href="@{/products}">Back to products</a></p>
</main>
</body>
</html>
