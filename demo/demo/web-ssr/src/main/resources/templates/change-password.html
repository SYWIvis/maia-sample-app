<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password | Maia</title>
  <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
<div th:replace="~{fragments :: navigation}"></div>
<main>
  <h1>Change Password</h1>
  <p class="success" th:if="${successMessage}" th:text="${successMessage}"></p>
  <form th:action="@{/change-password}" th:object="${passwordChangeForm}" method="post">
    <label for="newPassword">New password</label>
    <input id="newPassword" type="password" th:field="*{newPassword}" autocomplete="new-password" required minlength="8">
    <p class="error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>
    <button type="submit">Change password</button>
  </form>
</main>
</body>
</html>
