name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: chmod +x gradlew
      - run: ./gradlew build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build -w web

      # Cd 

      deploy:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
 
      
      - name: Build frontend into Spring static
        working-directory: frontend
        run: |
          CYPRESS_INSTALL_BINARY=0 npm ci
          (cd web && npx vite build)
          mkdir -p ../demo/demo/web/src/main/resources/static
          cp -r web/dist/* ../demo/demo/web/src/main/resources/static/
 
      
      - name: Build jar
        working-directory: demo/demo
        run: |
          chmod +x gradlew
          ./gradlew :web:bootJar
 
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
 
      
      - name: Deploy to Elastic Beanstalk
        env:
          APP_NAME: sample app
          ENV_NAME: Sampleapp-env
        run: |
          VERSION="${GITHUB_SHA::7}"
          BUCKET=$(aws elasticbeanstalk create-storage-location --query S3Bucket --output text)
          aws s3 cp demo/demo/web/build/libs/web-0.0.1-SNAPSHOT.jar "s3://$BUCKET/maia/$VERSION.jar"
          aws elasticbeanstalk create-application-version \
            --application-name "maia" --version-label "$VERSION" \
            --source-bundle S3Bucket="$BUCKET",S3Key="maia/$VERSION.jar"
          aws elasticbeanstalk update-environment \
            --environment-name "Sampleapp-env" --version-label "$VERSION"
          aws elasticbeanstalk wait environment-updated --environment-names "Sampleapp-env"